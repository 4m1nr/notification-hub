# Installed as /etc/systemd/sleep.conf.d/notification-hub.conf
#
# A suspended office PC is the single most likely cause of a silent watcher: the
# process is fine, the machine simply is not running it. Disabling sleep entirely
# is the Linux counterpart of the "disable sleep/hibernate" note in the original
# spec.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
