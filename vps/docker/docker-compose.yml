# The only containers in this stack.
#
# Everything else on the VPS runs natively. These stay containerised
# deliberately: changedetection.io, healthchecks.io, Calibre-Web-Automated and
# Shelfmark are Python apps with large, fast-moving dependency trees (CWA also
# bundles Calibre itself), and sockpuppetbrowser and Shelfmark's Cloudflare
# bypasser are packaged Chromiums that are genuinely painful to pin by hand.

name: notification-hub

services:
  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    # Loopback only: HAProxy is the single TLS terminator.
    ports:
      - "127.0.0.1:${CD_PORT}:5000"
    volumes:
      # A bind mount, not a named volume, so the backup job can read the
      # datastore as ordinary files without going through docker.
      - /var/lib/changedetection:/datastore
    environment:
      BASE_URL: "https://${CD_DOMAIN}"
      # Routes fetches through the Playwright browser below. Without this,
      # changedetection uses a plain HTTP fetcher and Browser Steps — the
      # feature that gets past a login form — is unavailable.
      PLAYWRIGHT_DRIVER_URL: "ws://sockpuppet:3000"
      USE_X_SETTINGS: "1"
    depends_on:
      - sockpuppet

  sockpuppet:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: sockpuppet
    restart: unless-stopped
    hostname: sockpuppet
    # Chromium's sandbox needs this. Note there is deliberately NO ports entry:
    # this is a remotely-drivable browser, and anything that can reach it can
    # make it fetch arbitrary URLs with your saved sessions.
    cap_add:
      - SYS_ADMIN
    environment:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1024"
      SCREEN_DEPTH: "16"
      MAX_CONCURRENT_CHROME_PROCESSES: "4"

  healthchecks:
    image: healthchecks/healthchecks:latest
    container_name: healthchecks
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HC_PORT}:8000"
    volumes:
      # The host's PostgreSQL socket directory. This is how the container reaches
      # the shared native database without any TCP listener being opened.
      - /var/run/postgresql:/var/run/postgresql
    environment:
      SITE_ROOT: "https://${HC_DOMAIN}"
      SITE_NAME: "Notification Hub Checks"
      ALLOWED_HOSTS: "${HC_DOMAIN}"
      SECRET_KEY: "${HC_SECRET_KEY}"
      # Single-user instance; nobody should be able to sign themselves up.
      REGISTRATION_OPEN: "False"
      DEBUG: "False"

      DB: postgres
      DB_HOST: /var/run/postgresql
      # The socket is named after the cluster's port, so this must match too.
      DB_PORT: "${PG_PORT}"
      DB_NAME: healthchecks
      DB_USER: healthchecks
      DB_PASSWORD: "${PG_HEALTHCHECKS_PASSWORD}"

      # Required for the built-in ntfy integration to be offered in the UI.
      # Without it the integration simply does not appear.
      NTFY_ENABLED: "True"
      # Email is not configured; alerts are delivered to the phone via ntfy.
      EMAIL_HOST: ""

  # Calibre-Web-Automated: the book library. Web reader, OPDS, Kobo sync, and an
  # ingest folder it watches, converting and importing whatever lands there.
  #
  # Its state is SQLite and cannot be moved into the shared PostgreSQL: the
  # library *is* Calibre's metadata.db, which Calibre's own tools (run by CWA on
  # every import) read and write directly, and app.db is Calibre-Web's, with no
  # database URL setting at all. backup.sh snapshots both with sqlite3 .backup.
  cwa:
    image: crocodilestick/calibre-web-automated:latest
    container_name: cwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CWA_PORT}:8083"
    volumes:
      - /var/lib/books/cwa-config:/config
      - /var/lib/books/library:/calibre-library
      # Shared with shelfmark below: it downloads here, CWA imports and then
      # deletes the file.
      - /var/lib/books/ingest:/cwa-book-ingest
    environment:
      PUID: "${BOOKS_UID}"
      PGID: "${BOOKS_GID}"
      TZ: "${BOOKS_TZ}"
      # HAProxy is the one proxy in front, so CWA trusts exactly one hop of
      # X-Forwarded-For. Wrong here and sessions break or the client IP is lost.
      TRUSTED_PROXY_COUNT: "1"
      # Local disk: keep SQLite's WAL mode and inotify-based watching.
      NETWORK_SHARE_MODE: "false"

  # Shelfmark (formerly calibre-web-automated-book-downloader): searches Anna's
  # Archive and its mirrors and downloads into CWA's ingest folder.
  #
  # It has no authentication by default. HAProxy gates it behind the admin basic
  # auth and passes the signed-in user in X-Auth-User, which AUTH_METHOD=proxy
  # trusts — safe only because this port is loopback and HAProxy strips any
  # client-supplied copy of that header.
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHELFMARK_PORT}:8084"
    volumes:
      - /var/lib/books/shelfmark-config:/config
      - /var/lib/books/ingest:/books
    environment:
      PUID: "${BOOKS_UID}"
      PGID: "${BOOKS_GID}"
      TZ: "${BOOKS_TZ}"
      INGEST_DIR: /books
      BOOK_LANGUAGE: "${BOOK_LANGUAGE}"
      # Anna's Archive moves between domains often. "auto" tries AA_MIRROR_URLS
      # in order and fails over, so a dead mirror is a hub.env edit, not a
      # code change.
      AA_BASE_URL: auto
      AA_MIRROR_URLS: "${AA_MIRROR_URLS}"
      # Without a donator key the slow download pages sit behind Cloudflare;
      # the standard image's bundled Chromium gets past it.
      USE_CF_BYPASS: "true"
      AUTH_METHOD: proxy
      PROXY_AUTH_USER_HEADER: X-Auth-User
    # The bundled browser is the memory hog. Cap it so a runaway Chromium cannot
    # take ntfy and PostgreSQL down with it.
    mem_limit: 2g
