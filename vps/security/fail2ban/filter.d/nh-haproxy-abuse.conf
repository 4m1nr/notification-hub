# Clients HAProxy has already rate-limited (429) or that probed the raw IP with
# an unknown Host header (421).
#
# HAProxy blocks these itself, in memory, within a single request. fail2ban is
# the durable layer underneath: a ban survives a HAProxy reload, outlives the
# stick table's one-hour expiry, and drops packets before they cost a TLS
# handshake.

[INCLUDES]
before = common.conf

[Definition]
_daemon = haproxy

failregex = ^%(__prefix_line)s<HOST>:\d+ \[[^\]]+\] \S+ \S+ \S+ (?:429|421)\s

ignoreregex =
