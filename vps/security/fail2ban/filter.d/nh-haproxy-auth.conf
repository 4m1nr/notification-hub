# Authentication failures seen by HAProxy, for every proxied service at once.
#
# Watching the proxy rather than each application is deliberate: the log format
# here is one we define ourselves in haproxy.cfg, so the regex cannot silently
# stop matching after an upstream project rewords its log lines. It also covers
# ntfy, Miniflux, healthchecks and changedetection with a single rule.
#
# HAProxy's httplog payload is:
#   <client_ip>:<port> [<date>] <frontend> <backend>/<server> <timings> <status> ...
#
# 401 = failed basic auth, or a rejected ntfy token
# 403 = rejected by an application's own authorisation
#
# __prefix_line comes from common.conf and absorbs the syslog date, hostname and
# "haproxy[pid]:" tag that rsyslog writes ahead of that payload.

[INCLUDES]
before = common.conf

[Definition]
_daemon = haproxy

failregex = ^%(__prefix_line)s<HOST>:\d+ \[[^\]]+\] \S+ \S+ \S+ (?:401|403)\s

ignoreregex =
