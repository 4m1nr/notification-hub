# fail2ban policy for the notification hub.
#
# HAProxy already blocks abusers in memory within a single request, so fail2ban
# is the durable layer underneath it: bans survive a HAProxy reload, outlive the
# stick table's one-hour expiry, and drop packets at the firewall before they
# cost a TLS handshake.

[DEFAULT]
# Never lock yourself out. Add your office and home addresses here.
ignoreip = 127.0.0.1/8 ::1 ${FAIL2BAN_IGNOREIP}

# Ban at the firewall. On Ubuntu this uses the iptables-nft shim and coexists
# with ufw, because fail2ban inserts its chain ahead of ufw's.
banaction = iptables-multiport
backend = auto

[sshd]
enabled = true
port = ssh
filter = sshd
maxretry = 4
findtime = 10m
bantime = 1h
# Escalate: each repeat offence multiplies the ban, up to a week.
bantime.increment = true
bantime.factor = 4
bantime.maxtime = 1w

[nh-haproxy-auth]
enabled  = true
filter   = nh-haproxy-auth
logpath  = /var/log/haproxy.log
port     = http,https
# A browser hitting a basic-auth URL produces exactly one 401 before it sends
# credentials, so a genuine user does not approach this. A script does at once.
maxretry = 15
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.factor = 4
bantime.maxtime = 1w

[nh-haproxy-abuse]
enabled  = true
filter   = nh-haproxy-abuse
logpath  = /var/log/haproxy.log
port     = http,https
# Reaching HAProxy's own rate limit repeatedly is already abnormal.
maxretry = 30
findtime = 10m
bantime  = 6h
bantime.increment = true
bantime.factor = 4
bantime.maxtime = 1w
