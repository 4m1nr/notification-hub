# fail2ban jails for the notification hub.
#
# ─────────────────────────────────────────────────────────────────────────────
# This file defines ONLY its own jails and touches nothing else.
#
# There is deliberately no [DEFAULT] section: settings there apply to every jail
# on the system, so putting banaction or ignoreip in a jail.d drop-in would
# silently rewrite the behaviour of jails this project did not create. Every
# option below is scoped to an nh-* jail.
#
# There is also deliberately no [sshd] jail. If you already run one, it is yours
# to configure; 85-fail2ban.sh reports whether one is active rather than
# imposing its own.
# ─────────────────────────────────────────────────────────────────────────────
#
# HAProxy already blocks abusers in memory within a single request. These jails
# are the durable layer underneath: bans survive a HAProxy reload, outlive the
# stick table's one-hour expiry, and drop packets at the firewall before they
# cost a TLS handshake.

[nh-haproxy-auth]
enabled  = true
filter   = nh-haproxy-auth
logpath  = ${HAPROXY_LOG}
port     = http,https
backend  = auto
# A browser hitting a basic-auth URL produces exactly one 401 before it sends
# credentials, so a genuine user does not approach this. A script does at once.
maxretry = 15
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.factor = 4
bantime.maxtime = 1w
ignoreip = 127.0.0.1/8 ::1 ${FAIL2BAN_IGNOREIP}

[nh-haproxy-abuse]
enabled  = true
filter   = nh-haproxy-abuse
logpath  = ${HAPROXY_LOG}
port     = http,https
backend  = auto
# Repeatedly reaching HAProxy's own rate limit is already abnormal.
maxretry = 30
findtime = 10m
bantime  = 6h
bantime.increment = true
bantime.factor = 4
bantime.maxtime = 1w
ignoreip = 127.0.0.1/8 ::1 ${FAIL2BAN_IGNOREIP}
