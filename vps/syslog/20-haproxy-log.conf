# Route HAProxy's traffic log to its own file.
#
# fail2ban watches this file for authentication failures across every proxied
# service, so it needs a deterministic location rather than whatever the distro's
# default local0 handling happens to be.
if $programname startswith 'haproxy' then {
  action(type="omfile" file="/var/log/haproxy.log" fileOwner="root" fileGroup="adm" fileCreateMode="0640")
  stop
}
