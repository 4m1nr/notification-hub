# Example client configuration — install as /etc/rsyslog.d/90-forward-to-hub.conf
# on any machine whose logs should reach the hub.
#
# Replace logs.example.com with your SYSLOG_DOMAIN, and point the CA/cert/key at
# certificates this client actually holds.

global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/ssl/certs/ISRG_Root_X1.pem"
)

# Spool to disk if the collector is unreachable, so a network partition delays
# logs rather than losing them.
action(type="omfwd"
       target="logs.example.com"
       port="6514"
       protocol="tcp"
       StreamDriver="gtls"
       StreamDriverMode="1"
       StreamDriverAuthMode="x509/name"
       StreamDriverPermittedPeers="logs.example.com"
       queue.type="LinkedList"
       queue.filename="fwd-hub"
       queue.maxdiskspace="256m"
       queue.saveOnShutdown="on"
       action.resumeRetryCount="-1")
