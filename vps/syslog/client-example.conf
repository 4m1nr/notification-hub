# Forwarding logs from OTHER machines — deliberately not enabled.
#
# The collector on the VPS listens on 127.0.0.1 only, so this file will not work
# as-is. It is kept as documentation of what turning on remote ingestion would
# actually require, because the naive version is dangerously wrong.
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST
#
# rsyslog's TLS driver offers exactly four authentication modes:
#
#   anon               no client authentication at all — ANYONE who can reach
#                      the port can inject logs
#   x509/certvalid     any certificate that validates against the configured CA.
#                      If that CA is a public one such as Let's Encrypt, this
#                      accepts a certificate issued to anyone, for any domain —
#                      which is to say, the entire internet.
#   x509/name          a valid certificate whose CN/SAN is on a permitted list
#   x509/fingerprint   a specific pinned certificate
#
# Only the last two authenticate anything, and both require issuing client
# certificates from a CA you control. There is no password or token option: the
# syslog protocol has no concept of one.
#
# So if you ever open this listener to the network, you must:
#
#   1. Create a PRIVATE CA (not Let's Encrypt) and issue a client certificate
#      per machine.
#   2. Set the collector's DefaultNetstreamDriverCAFile to that private CA.
#   3. Set StreamDriver.AuthMode="x509/name" with an explicit permittedPeer list.
#   4. Restrict the port at the firewall to known source addresses as well.
#
# Anything less means strangers can write to your alerting pipeline.
# ─────────────────────────────────────────────────────────────────────────────
#
# For reference, the client side of a correctly authenticated setup:

# global(
#   DefaultNetstreamDriver="gtls"
#   DefaultNetstreamDriverCAFile="/etc/rsyslog-certs/private-ca.pem"
#   DefaultNetstreamDriverCertFile="/etc/rsyslog-certs/client.crt"
#   DefaultNetstreamDriverKeyFile="/etc/rsyslog-certs/client.key"
# )
#
# action(type="omfwd"
#        target="logs.example.com"
#        port="6514"
#        protocol="tcp"
#        StreamDriver="gtls"
#        StreamDriverMode="1"
#        StreamDriverAuthMode="x509/name"
#        # Pin the collector's identity, so a hijacked DNS record cannot
#        # redirect your logs somewhere else.
#        StreamDriverPermittedPeers="logs.example.com"
#        # Spool to disk if the collector is unreachable, so a network partition
#        # delays logs rather than losing them.
#        queue.type="LinkedList"
#        queue.filename="fwd-hub"
#        queue.maxdiskspace="256m"
#        queue.saveOnShutdown="on"
#        action.resumeRetryCount="-1")
